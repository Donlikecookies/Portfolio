{% extends 'main_app/base.html' %}
{% block title %}Contact Me{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card p-4 p-md-5 shadow-sm border-0" style="background-color: #ffffff; border-top: 5px solid #5c3a21 !important;">
            <div class="card-body">
                <h2 class="fw-bold mb-3" style="color: #3b271a; font-family: 'Playfair Display', serif;">Get in Touch</h2>
                <p class="text-muted mb-4">Have an inquiry or project proposal? Send a message below.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="first_name" class="form-label fw-semibold text-secondary small">First Name</label>
                            <input type="text" class="form-control bg-light" id="first_name" name="first_name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold text-secondary small">Last Name</label>
                            <input type="text" class="form-control bg-light" id="last_name" name="last_name" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="email" class="form-label fw-semibold text-secondary small">Email Address</label>
                            <input type="email" class="form-control bg-light" id="email" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label for="contact_number" class="form-label fw-semibold text-secondary small">Contact Number</label>
                            <input type="text" class="form-control bg-light" id="contact_number" name="contact_number">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold text-secondary small">Address</label>
                        <input type="text" class="form-control bg-light" id="address" name="address">
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label fw-semibold text-secondary small">Message</label>
                        <textarea class="form-control bg-light" id="message" name="message" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn w-100 py-2 text-white fw-semibold" style="background-color: #5c3a21; border-radius: 6px;">Send Message</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
