<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    
    <!-- Google Fonts: Playfair Display for headings, Inter for clean body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Stylized Woody Theme CSS -->
    <style>
/* Classic Traditional Ribbon Styling */
.navbar {
    background-color: #3b271a !important; /* Deep Aged Mahogany */
    border-bottom: 4px solid #5c3a21;     /* Carved wood border effect */
    box-shadow: inset 0 -3px 5px rgba(0,0,0,0.3); /* Subtle inner shadow for depth */
    font-family: 'Playfair Display', serif;
}

.navbar-brand {
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    color: #f2e3d5 !important;
    border: 1px dashed #8c6239;
    padding: 4px 10px;
}

.navbar-nav .nav-link {
    color: #d9c3b0 !important;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    transition: all 0.2s ease;
}

.navbar-nav .nav-link:hover, 
.navbar-nav .nav-link.active {
    color: #ffffff !important;
    background-color: #4a3221;
    border-radius: 4px;
}
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Responsive Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">Portfolio.</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="navbar-nav ms-auto align-items-lg-center">
            <a class="nav-link {% if request.resolver_match.url_name == 'personal_info' %}active{% endif %}" href="{% url 'personal_info' %}">About</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'project_list' %}active{% endif %}" href="{% url 'project_list' %}">Projects</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'testimony_list' %}active{% endif %}" href="{% url 'testimony_list' %}">Testimonials</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a>
            {% if request.user.is_superuser %}
                <a class="nav-link text-warning ms-lg-2 {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-5 flex-grow-1">
        <!-- Django Messages -->
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm border-0" role="alert" style="border-radius: 10px;">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-0 small">&copy; {% now "Y" %} Personal Portfolio. Built with Django & Craftsmanship.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
