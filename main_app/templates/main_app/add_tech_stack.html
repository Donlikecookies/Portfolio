{% extends 'main_app/base.html' %}
{% block title %}Add Tech Stack{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Add New Tech Stack</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save Tech Stack</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
